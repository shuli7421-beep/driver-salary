    button { width:100%; min-height:52px; margin:6px 0 12px; border:0; border-radius:999px; background:var(--blue); color:#fff; box-shadow:0 5px 12px #3b82f640; font:700 16px inherit; }
    button:active { transform:scale(.98); }

    .notice.error { color:#c2413b; }.notice.success { color:var(--green); }
    .divider { height:1px; margin:28px 0 20px; background:var(--line); }

    .card { padding:16px; border:1px solid #edf2f7; border-radius:20px; background:#fff; box-shadow:0 2px 7px #1e293b08; }
    .salary-card { border-color:#dbeafe; background:#fbfdff; }.salary-grid { display:grid; gap:12px; }
    .salary-line { display:flex; justify-content:space-between; gap:12px; padding:13px 14px; border:1px solid #dbeafe; border-radius:16px; background:#fff; }

    .note { margin:12px 0 0; color:#475569; font-size:17px; font-weight:600; line-height:1.7; overflow-wrap:anywhere; }
    .attendance { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .day { display:grid; min-width:0; min-height:82px; place-content:center; gap:4px; padding:10px 8px; border:1px solid var(--line); border-radius:16px; color:var(--muted); text-align:center; }
    .day small { margin:0; font:700 12px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }.day b { font-size:15px; line-height:1.3; }.day.on { border-color:#bfdbfe; background:var(--blue-soft); color:#1d4ed8; }

</head>

    </section>

  <script>
    const $ = (id) => document.getElementById(id);
    const raw = JSON.parse($("data").textContent);

    function parseCsv(text) {
      const rows = text.trim().split(/\r?\n/).map((row) =>
        row.match(/(?:^|,)("(?:[^"]|"")*"|[^,]*)/g).map((value) =>
          value.replace(/^,/, "").replace(/^"|"$/g, "").replace(/""/g, "\"")
        )
      );
      const [headers, ...dataRows] = rows;
      return dataRows.map((row) => Object.fromEntries(headers.map((key, index) => [key, row[index] || ""])));
    }

    const database = { trips: parseCsv(raw.trips), salary: parseCsv(raw.salary), attendance: parseCsv(raw.attendance) };
    const normalise = (value) => String(value || "").trim().replace(/\s+/g, "").replace(/[０-９]/g, (char) => String.fromCharCode(char.charCodeAt(0) - 65248)).toUpperCase();
    const escapeHtml = (value) => String(value || "").replace(/[&<>"']/g, (char) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", "\"":"&quot;", "'":"&#39;" }[char]));
    const money = (value) => `${new Intl.NumberFormat("zh-CN", { minimumFractionDigits:2, maximumFractionDigits:4 }).format(Number(value || 0))} 元`;
    const time = (value) => String(value || "暂无记录").replace(/^20\d{2}[-/]/, "").replace(/:00$/, "");
    const tripTime = (value) => new Date(String(value).replace(/-/g, "/")).getTime() || 0;

    function renderResult(trips, salary, attendance) {
      trips.sort((left, right) => tripTime(right["发车时间"]) - tripTime(left["发车时间"]));
      $("trip-count").textContent = `${trips.length} 趟`;
      $("salary-grid").innerHTML = [["出勤工资", "出勤工资"], ["趟次工资", "趟次工资"], ["工资调整", "工资调整"]].map(([label, key]) => `<div class="salary-line"><span>${label}</span><b>${money(salary[key])}</b></div>`).join("") + `<div class="salary-line salary-total"><span>应发合计</span><b>${money(salary["合计"])}</b></div>`;
      $("note").textContent = salary["调整备注"] ? `调整备注：${salary["调整备注"]}` : "暂无工资调整备注";
      const days = Object.entries(attendance).filter(([key]) => key !== "发生人名称" && key !== "出车天数");
      const attendanceStatus = (status) => normalise(status) === "1" ? "出车" : (status || "暂无");
      $("attendance-count").textContent = `${attendance["出车天数"] || 0} 天出车`;
      $("attendance").innerHTML = days.map(([date, status]) => { const display = attendanceStatus(status); return `<div class="day ${display === "出车" ? "on" : ""}"><small>${escapeHtml(date.slice(5))}</small><b>${escapeHtml(display)}</b></div>`; }).join("");
      $("trips").innerHTML = trips.map((trip) => `<article class="card"><div class="info-row"><span class="info-label">发车时间</span><span class="info-value">${escapeHtml(time(trip["发车时间"]))}</span></div><div class="info-row"><span class="info-label">卸货时间</span><span class="info-value">${escapeHtml(time(trip["到达时间"]))}</span></div><div class="info-row"><span class="info-label">项目</span><span class="info-value"><i class="project">${escapeHtml(trip["项目"].replace(/;$/, ""))}</i></span></div><div class="info-row"><span class="info-label">应发工资</span><span class="info-value">${money(trip["应发工资"])}</span></div></article>`).join("");
      $("result").hidden = false;
    }

    $("id-tail").addEventListener("input", (event) => { event.target.value = normalise(event.target.value).slice(0, 6); });
    $("query-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const name = normalise($("name").value);
      const idTail = normalise($("id-tail").value);
      const notice = $("notice");
      $("result").hidden = true;
      if (!name || !idTail) { notice.className = "notice error"; notice.textContent = "请填写姓名和身份证后六位"; return; }
      if (!/^\d{5}[\dX]$/.test(idTail)) { notice.className = "notice error"; notice.textContent = "身份证后六位需为 5 位数字加数字或 X"; return; }
      const trips = database.trips.filter((trip) => normalise(trip["发生人名称"]) === name && normalise(trip["身份证后六位"]) === idTail);
      if (!trips.length) { notice.className = "notice error"; notice.textContent = database.salary.some((item) => normalise(item["发生人名称"]) === name) ? "本工资期缺少身份校验数据，暂不展示工资。" : "未找到记录，请核对姓名和身份证后六位"; return; }
      const salary = database.salary.find((item) => normalise(item["发生人名称"]) === name);
      if (!salary) { notice.className = "notice error"; notice.textContent = "本工资期暂无工资汇总，暂不展示结果"; return; }
      renderResult(trips, salary, database.attendance.find((item) => normalise(item["发生人名称"]) === name) || {});
      notice.className = "notice success";
      notice.textContent = "已为你找到对应的本期记录";
      $("result").scrollIntoView({ behavior:"smooth", block:"start" });
    });
  </script>
</body>
</html>
