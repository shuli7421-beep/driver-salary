        .table-wrapper { overflow-x:auto; margin:12px 0 4px; border-radius:20px; }
        .trip-table { width:100%; border-collapse:collapse; font-size:0.85rem; }
        .trip-table th, .trip-table td { padding:10px 8px; text-align:left; border-bottom:1px solid #eef2f6; }
        .trip-table th { background:#f8fafc; font-weight:600; color:#334155; }
        .trip-table td:last-child, .trip-table th:last-child { text-align:right; font-weight:600; color:#0f172a; }
        .att-grid { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
        .day-chip { background:#f1f5f9; border-radius:40px; padding:6px 12px; font-size:0.75rem; font-weight:500; display:inline-flex; align-items:center; gap:6px; }
        .day-chip.出车 { background:#dcfce7; color:#15803d; border-left:3px solid #22c55e; }
        .day-chip.未出车 { background:#ffe4e2; color:#b91c1c; border-left:3px solid #ef4444; }
        .salary-row { display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px dashed #e2e8f0; }
        .salary-label { font-weight:500; color:#475569; }
        .salary-value { font-weight:600; color:#0f172a; }
        .salary-total { background:#fef9e3; margin-top:12px; padding:12px 16px; border-radius:20px; font-weight:700; display:flex; justify-content:space-between; font-size:1.1rem; }
        .remark-note { font-size:1.1rem; color:#6c757d; margin-top:6px; background:#f9f9fb; padding:6px 12px; border-radius:16px; }
        .empty-tip { text-align:center; padding:28px 16px; color:#64748b; font-size:0.9rem; }
        footer { text-align:center; font-size:0.7rem; color:#94a3b8; margin-top:24px; }
        @media (max-width:480px) { body { padding:12px 10px 30px; } .card { padding:16px; } .card-header { font-size:1.2rem; } .trip-table { font-size:0.75rem; } .trip-table th, .trip-table td { padding:6px 5px; } }

    document.getElementById('queryBtn').addEventListener('click', function() {
        const name = document.getElementById('driverName').value.trim();
        const idSuffix = document.getElementById('idCardSuffix').value.trim();
        const errorDiv = document.getElementById('errorMsg');
        const resultArea = document.getElementById('resultArea');

        errorDiv.style.display = 'none';
        errorDiv.innerText = '';

            errorDiv.innerText = '❌ 请完整填写姓名和身份证后六位';

            resultArea.style.display = 'none';
            return;
        }

            errorDiv.innerText = '⚠️ 未找到匹配的司机信息，请核对姓名与身份证后六位';
            errorDiv.style.display = 'block';
            resultArea.style.display = 'none';
            return;

        resultArea.style.display = 'block';

            document.getElementById('salaryContent').innerHTML = '<div class="empty-tip">暂无工资条数据</div>';

            let html = '<div class="att-grid">';
            DATES.forEach(date => {
